<!-- SURVIVOR TAB CONTENT -->
<section id="tab-survivor" class="tab-content space-y-4 hidden">
  <div class="bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-4 shadow-xl flex flex-wrap items-center justify-between gap-4 text-xs">
    <div class="flex flex-wrap items-center gap-4">
      <h2 class="text-sm font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2">
        <i class="fa-solid fa-skull text-amber-500"></i> Survivor Pool (Eliminations Start Week 6)
      </h2>

      <!-- VIEW TOGGLE -->
      <div class="flex items-center bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 p-1 rounded-lg">
        <button id="btn-toggle-survivor-table" class="px-3 py-1 rounded-md text-xs font-semibold bg-brand-600 text-white shadow">Table</button>
        <button id="btn-toggle-survivor-graph" class="px-3 py-1 rounded-md text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200">Graph</button>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="btn-export-survivor-csv" title="Download Survivor CSV" class="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 px-2.5 py-1 rounded border border-slate-300 dark:border-slate-700 transition flex items-center gap-1 text-xs">
        <i class="fa-solid fa-file-csv"></i> CSV
      </button>
      <button id="btn-export-survivor-png" title="Print/Export Survivor View" class="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 px-2.5 py-1 rounded border border-slate-300 dark:border-slate-700 transition flex items-center gap-1 text-xs">
        <i class="fa-solid fa-print"></i> Print
      </button>
    </div>
  </div>

  <!-- SURVIVOR TABULAR VIEW -->
  <div class="bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-6 shadow-xl overflow-x-auto" id="survivor-container">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold tracking-tight text-slate-800 dark:text-slate-100">Survivor</h1>
      <p class="text-base font-semibold text-slate-500 dark:text-slate-400 mt-1">NDL <span id="survivor-year-label">2026</span></p>
    </div>
    
    <div class="overflow-x-auto">
      <table class="survivor-table min-w-full" id="survivor-table">
        <thead id="survivor-thead"></thead>
        <tbody id="survivor-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- SURVIVOR GRAPH VIEW -->
  <div id="survivor-chart-container" class="bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-5 shadow-xl hidden">
    <div class="relative w-full h-[520px]">
      <canvas id="survivorChart"></canvas>
    </div>
  </div>

  <!-- REPLAY CONTROLS -->
  <div class="bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-3 shadow-xl flex flex-wrap items-center justify-between gap-4 text-xs">
    <div class="flex items-center gap-3">
      <button id="btn-survivor-play-pause" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-3 py-1.5 rounded-md transition shadow flex items-center gap-1.5">
        <i id="survivor-play-icon" class="fa-solid fa-play"></i> <span id="survivor-play-text">Play</span>
      </button>
      <button id="btn-survivor-restart" class="bg-brand-600 hover:bg-brand-500 text-white font-semibold px-3 py-1.5 rounded-md transition shadow flex items-center gap-1.5">
        <i class="fa-solid fa-rotate-right"></i> Restart
      </button>
    </div>

    <div class="flex flex-wrap items-center gap-4">
      <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 px-2.5 py-1 rounded-md">
        <span class="text-slate-500 dark:text-slate-400 font-medium">Speed:</span>
        <input type="range" id="survivor-speed-slider" min="0.5" max="5" value="1" step="0.5" class="w-20 accent-brand-500 cursor-pointer" />
        <span id="survivor-speed-val" class="font-mono font-bold text-brand-600 dark:text-brand-400 min-w-[32px]">1x</span>
      </div>

      <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 px-2.5 py-1 rounded-md">
        <i class="fa-solid fa-clock text-slate-400"></i>
        <input type="range" id="survivor-scrubber" min="0" max="100" value="100" class="w-44 md:w-64 accent-brand-500 cursor-pointer" />
      </div>
    </div>
  </div>
</section>
