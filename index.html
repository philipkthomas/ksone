 const d=sc.filter(r=>r.TMA==p[0]&&r.TMB==p[1]).sort((a,b)=>a.TIME<b.TIME?-1:1),A=TN[F.y+'|'+p[0]]||{n:p[0],m:''},B=TN[F.y+'|'+p[1]]||{n:p[1],m:''},sl=$('#sl');sl.max=d.length;sl.value=d.length;
 const draw=k=>{const e=d.slice(0,k),x=e.map(r=>r.TIME.replace(' ','T')),ca=mc(A.m),cb=mc(B.m);
  plot('c1',[{x,y:e.map(r=>+r.TMAWP),yaxis:'y',fill:'tozeroy',name:A.n+' win%',line:{width:0},fillcolor:ca+'55'},
  {x,y:e.map(r=>+r.TMAPTS),yaxis:'y2',name:A.n+' pts',line:{color:ca}},{x,y:e.map(r=>+r.TMBPTS),yaxis:'y2',name:B.n+' pts',line:{color:cb}},
  {x,y:e.map(r=>+r.TMAPROJ),yaxis:'y2',name:A.n+' proj',line:{color:ca,dash:'dot'}},{x,y:e.map(r=>+r.TMBPROJ),yaxis:'y2',name:B.n+' proj',line:{color:cb,dash:'dot'}}],
  {title:`${A.n} vs ${B.n}`,yaxis:{range:[0,100],title:'Win prob %'},yaxis2:{overlaying:'y',side:'right',title:'Points'},xaxis:{type:'date',range:[d[0].TIME.replace(' ','T'),d[d.length-1].TIME.replace(' ','T')],tickformat:'%a %m/%d %-I%p'},shapes:[{type:'line',xref:'paper',x0:0,x1:1,y0:50,y1:50,line:{dash:'dash',color:'#888'}}]})};
 draw(d.length);sl.oninput=()=>draw(+sl.value);let t;$('#pl').onclick=()=>{clearInterval(t);let k=1;t=setInterval(()=>{sl.value=k;draw(k);if(++k>d.length)clearInterval(t)},60)}};
V.Luck=()=>{if(!gy().length)return empty();return help('Above the diagonal = more wins than expected (lucky); below = unlucky.')+box('c1',480)};
V.Luck.after=()=>{const A=stand(F.y,F.w2,F.w1);plot('c1',[{x:A.map(s=>+(s.etp*s.n).toFixed(2)),y:A.map(s=>s.W+s.T/2),text:A.map(s=>s.m),mode:'markers+text',textposition:'top center',marker:{size:12,color:A.map(s=>mc(s.m))},hovertemplate:'%{text}<br>Expected %{x}<br>Actual %{y}<extra></extra>'},{x:[0,Math.max(...A.map(s=>s.n))],y:[0,Math.max(...A.map(s=>s.n))],mode:'lines',line:{dash:'dash',color:'#888'},hoverinfo:'skip'}],{showlegend:false,xaxis:{title:'Expected wins'},yaxis:{title:'Actual wins'}})};
/* ===== shell: nav, filters, hash, persistence ===== */
let TAB='Standings';
const hash=()=>{location.hash=new URLSearchParams({t:TAB,y:F.y,a:F.w1,b:F.w2,w:F.w,m:F.m}).toString()};
function readHash(){const p=new URLSearchParams(location.hash.slice(1));if(p.get('t')in V)TAB=p.get('t');if(p.get('y'))F.y=+p.get('y');if(p.get('a'))F.w1=+p.get('a');if(p.get('b'))F.w2=+p.get('b');if(p.get('w'))F.w=+p.get('w');F.m=p.get('m')||''}
function go(){try{$('#nav').innerHTML=Object.keys(V).map(t=>`<button class="${t==TAB?'on':''}" onclick="TAB='${t}';go()">${t}</button>`).join('');
 const opt=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join(''),ws=[...Array(maxW())].map((_,i)=>i+1);
 $('#bar').innerHTML=`<label>Year <select onchange="F.y=+this.value;go()">${opt(YRS,F.y)}</select></label><label>Weeks <select onchange="F.w1=+this.value;go()">${opt(ws,F.w1)}</select>–<select onchange="F.w2=+this.value;go()">${opt(ws,Math.min(F.w2,maxW()))}</select></label><label>Week <select onchange="F.w=+this.value;go()">${opt(ws,F.w)}</select></label><label>Manager <select onchange="F.m=this.value;go()"><option value="">All</option>${opt(M,F.m)}</select></label>`;
 $('#lbl').textContent=S.demo?'Demo data – Weeks 1-8, 2026':`${R.points.size} player-weeks loaded`;
 $('#view').innerHTML=G.length?V[TAB]():empty('Drop W##Points.csv (plus Scores/Teams/Transactions) into the file picker above.');
 if(G.length&&V[TAB].after)V[TAB].after();hash()}catch(e){console.error(e);$('#view').innerHTML=empty('Something went wrong rendering this view: '+esc(e.message))}}
const save=()=>kv('set','state',{files:S.files,demo:S.demo,set:S.set});
async function addTexts(ts){if(S.demo){S.files=[];R=newR();S.demo=false}for(const t of ts){if(ingest(t))S.files.push(t)}compute();await save();go()}
$('#fi').onchange=async e=>addTexts(await Promise.all([...e.target.files].map(f=>f.text())));
$('#go').onclick=async()=>{try{addTexts([await(await fetch($('#url').value)).text()])}catch(e){alert('Could not load URL (CORS or bad link): '+e.message)}};
$('#rst').onclick=async()=>{await kv('clear');location.hash='';location.reload()};
$('#th').onclick=()=>{const d=document.documentElement;d.dataset.t=d.dataset.t=='dark'?'':'dark';document.body.dataset.t=d.dataset.t;go()};
document.addEventListener('keydown',e=>{if(e.key=='Escape'){F.m='';go()}});addEventListener('hashchange',()=>{readHash();go()});
(async()=>{R=newR();const st=await kv('get','state');
 if(st&&st.files?.length){S=st;S.files.forEach(ingest)}else{DEMO.forEach(ingest);S.files=[];S.demo=true}
 compute();readHash();if(!F.w)F.w=maxW();if(!(location.hash.includes('w=')))F.w=maxW();go()})();
