<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NDL League Data Heaven</title>
<style>
:root{--bg:#fff;--fg:#1b1f24;--card:#f3f5f7;--bd:#d0d7de;--ac:#0072B2}
[data-t=dark]{--bg:#12161b;--fg:#e6e9ed;--card:#1c222a;--bd:#323b46;--ac:#56B4E9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,"Segoe UI","Apple Color Emoji","Segoe UI Emoji",sans-serif;overflow-wrap:anywhere}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:6px 10px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
nav button,.btn{background:none;color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:5px 9px;cursor:pointer;font:inherit}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--bd)}
select,input,textarea{background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:4px 6px;font:inherit}
main{padding:10px 12px;max-width:1400px;margin:auto}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:4px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--card);cursor:pointer}td:nth-child(2),th:nth-child(2){text-align:left}
tr.po td{border-bottom:2px dashed var(--ac)}tr.hl td{background:color-mix(in srgb,var(--ac) 18%,transparent)}
.ch{width:100%;height:520px}.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;margin:8px 0}
.empty{padding:40px;text-align:center;border:2px dashed var(--bd);border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.sv{display:flex;gap:2px;align-items:center;margin:2px 0}.sv b{width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.sv i{font-style:normal;font-size:11px;text-align:center;padding:3px 0;overflow:hidden;white-space:nowrap}
small{opacity:.75}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
@media print{nav,.bar,.noprint{display:none}}
</style></head><body>
<nav id="nav"></nav>
<div class="bar noprint">
 <label>Season <select id="fy"></select></label>
 <label>Weeks <input id="w1" type="number" min="1" value="1" style="width:56px"> – <input id="w2" type="number" min="1" value="99" style="width:56px"></label>
 <label title="Playoff weeks have no matchup data (opponent = 0), so they are excluded from W-L, ETEW, WAE, Rank, Survivor and Belt. Ticking this adds them to Points by Position only."><input id="po" type="checkbox"> Playoff wks</label>
 <label title="The week named in the currentweek table is hidden from results until its games are final. Tick to include the partial week."><input id="ip" type="checkbox"> In-progress wk</label>
 <label class="btn">Add CSVs / .sqlite<input id="file" type="file" multiple accept=".csv,.sqlite,.db" hidden></label>
 <button class="btn" id="th">◐ Theme</button><button class="btn" onclick="print()">Print</button>
 <small id="st"></small>
</div>
<main id="main"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.1/echarts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
/* ============ 0. STATE, STORAGE, INGEST ============ */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);
const PAL=['#0072B2','#E69F00','#009E73','#D55E00','#CC79A7','#56B4E9','#C9A800','#999999','#332288','#882255'];
const S={pts:[],scr:[],teams:[],tx:[],set:{belt:'Mike',svStart:'',tie:'hold',csvUrls:'',sqlUrl:'https://pub-19c72385a8a14ab098f1badf7251e65b.r2.dev/live.db'},yr:'',lg:'',w:[1,99],po:false,ip:false,cw:null,hl:null,tab:'standings',wae:'wl',pos:'stack',pw:'avg',mw:'',lvw:'',lm:'',cur:0,dark:matchMedia('(prefers-color-scheme:dark)').matches};
const idb=new Promise(r=>{try{const q=indexedDB.open('ndl',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const put=async(k,v)=>{const d=await idb;if(d)d.transaction('kv','readwrite').objectStore('kv').put(v,k)};
const get=async k=>{const d=await idb;return d?new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}):undefined};
const KEY={pts:r=>[r.league,r.year,r.week,r.team_id,r.player_id].join('|'),scr:r=>[r.league,r.YR,r.WK,r.TIME,r.TMA,r.TMB].join('|'),teams:r=>[r.league,r.year,r.team_id].join('|'),tx:r=>[r.transaction_id,r.player_id,r.type].join('|')};
function merge(k,rows){if(k=='cw'){const r=rows.filter(x=>x.year&&x.week).sort((a,b)=>a.year-b.year||a.week-b.week).pop();if(r)S.cw={year:+r.year,week:+r.week};return}
 rows.forEach(r=>{if(!r.league)r.league='NDL'});
 const m=new Map(S[k].map(r=>[KEY[k](r),r]));rows.forEach(r=>m.set(KEY[k](r),r));S[k]=[...m.values()]}
const kind=f=>{const h=new Set(f);return h.has('TMAWP')?'scr':h.has('selected_position')?'pts':h.has('faab_balance')?'teams':h.has('transaction_id')?'tx':(h.size==2&&h.has('year')&&h.has('week'))?'cw':null};
function ingestCSV(t){const p=Papa.parse(t.trim(),{header:true,dynamicTyping:true,skipEmptyLines:true,transformHeader:h=>h.trim()});const k=kind(p.meta.fields||[]);if(k)merge(k,p.data);return k}
async function ingestSQL(buf){const SQL=await initSqlJs({locateFile:f=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/'+f});const db=new SQL.Database(new Uint8Array(buf));
 (db.exec("select name from sqlite_master where type='table'")[0]?.values||[]).forEach(([n])=>{const r=db.exec(`select * from "${n}"`)[0];if(!r)return;const k=kind(r.columns);if(k)merge(k,r.values.map(v=>Object.fromEntries(r.columns.map((c,i)=>[c,v[i]]))))});db.close()}
async function save(){for(const k of['pts','scr','teams','tx'])await put(k,S[k]);await put('cw',S.cw);await put('set',S.set)}
async function files(fl){let n=0;for(const f of fl){try{if(/\.(sqlite|db)$/i.test(f.name))await ingestSQL(await f.arrayBuffer());else ingestCSV(await f.text());n++}catch(e){console.warn(f.name,e)}}await save();refresh();$('#st').textContent=`Loaded ${n} file(s)`}
$('#file').onchange=e=>files(e.target.files);
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();files(e.dataTransfer.files)});

/* ============ 1. LIVE UPDATING ============ */
async function poll(){const s=S.set;try{
  for(const u of(s.csvUrls||'').split(/\s+/).filter(Boolean)){ingestCSV(await(await fetch(u,{cache:'no-store'})).text())}
  if(s.sqlUrl)await ingestSQL(await(await fetch(s.sqlUrl,{cache:'no-store'})).arrayBuffer());
  if(s.csvUrls||s.sqlUrl){await save();refresh();$('#st').textContent='Updated '+new Date().toLocaleTimeString()}}catch(e){$('#st').textContent='Poll failed: '+e.message}}
setInterval(()=>{if(S.set.csvUrls||S.set.sqlUrl)poll()},60000);

/* ============ 2. METRICS MODULE ============ */
const sum=a=>a.reduce((x,y)=>x+y,0),mean=a=>a.length?sum(a)/a.length:0,sd=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(sum(a.map(x=>(x-m)**2))/(a.length-1))};
const ALLSLOTS=['SFX1','FX3','FX2','FX1','DEF1','K1','TE1','WR2','WR1','RB2','RB1','QB1'];
const isStart=r=>r.selected_position!=='BN'&&r.selected_position!=='IR';
const prim=r=>String(r.position||'').split(',')[0];
function slotCfg(rows){const c={sf:false,def:false,k:false,fx:0},n=new Map();rows.forEach(r=>{if(!isStart(r))return;const p=prim(r);if(r.selected_position==='Q/W/R/T')c.sf=true;if(p==='DEF')c.def=true;if(p==='K')c.k=true;
 if(r.selected_position==='W/R/T'||r.selected_position==='W/R'){const k=r.team_id+'|'+r.week;n.set(k,(n.get(k)||0)+1)}});c.fx=Math.min(3,Math.max(0,...n.values()));return c}
const slotNames=c=>ALLSLOTS.filter(s=>s==='SFX1'?c.sf:s==='DEF1'?c.def:s==='K1'?c.k:s.startsWith('FX')?+s[2]<=c.fx:true);
function slots(pl,c){const st=pl.filter(isStart),o={},used=new Set();slotNames(c).forEach(n=>o[n]=0);let nq=0;
 const take=(p,ns)=>{const a=st.filter(r=>prim(r)===p&&!used.has(r)).sort((x,y)=>y.points-x.points);ns.forEach((n,i)=>{if(a[i]){o[n]=a[i].points;used.add(a[i])}});return Math.min(a.length,ns.length)};
 nq=take('QB',c.sf?['QB1','SFX1']:['QB1']);take('RB',['RB1','RB2']);take('WR',['WR1','WR2']);take('TE',['TE1']);if(c.def)take('DEF',['DEF1']);if(c.k)take('K',['K1']);
 const l=st.filter(r=>!used.has(r)&&!(['DEF','K'].includes(prim(r))&&!c.def&&!c.k)).map(r=>r.points).sort((a,b)=>b-a);if(c.sf&&nq<2)o.SFX1=l.shift()||0;
 for(let i=1;i<=c.fx;i++)o['FX'+i]=l[i-1]||0;return o}
function agg(T){const m=new Map();T.forEach(t=>{if(!m.has(t.mgr))m.set(t.mgr,{mgr:t.mgr,rows:[]});m.get(t.mgr).rows.push(t)});
 const a=[...m.values()].map(o=>{const R=o.rows.sort((x,y)=>x.week-y.week),g=R.length,pf=R.map(t=>t.pf),L=R[g-1],W=R.filter(t=>t.res==1).length,Ti=R.filter(t=>t.res==.5).length,et=mean(R.map(t=>t.etew));
  const bi=pf.indexOf(Math.max(...pf)),wi=pf.indexOf(Math.min(...pf)),s=[...pf].sort((x,y)=>x-y),tr=g>2?s.slice(1,-1):s;
  return Object.assign(o,{team:L.team,id:L.id,g,W,L:g-W-Ti,T:Ti,PF:sum(pf),PA:sum(R.map(t=>t.pa)),et,exp:et*g,wabl:W+Ti/2-et*g,best:pf[bi],bw:R[bi].week,worst:pf[wi],ww:R[wi].week,avg:mean(pf),avgT:mean(tr),sd:sd(pf),pfs:pf})});
 a.sort((x,y)=>(y.W+y.T/2)-(x.W+x.T/2)||y.PF-x.PF);a.forEach((o,i)=>o.rank=i+1);a.forEach(o=>o.rE=1+a.filter(x=>x.et>o.et+1e-9).length);return a}
function survivor(T,weeks){let alive=new Set(T.map(t=>t.mgr)),out=[];for(const w of weeks){const g=T.filter(t=>t.week==w&&alive.has(t.mgr));if(g.length<2)break;const lo=g.reduce((a,b)=>b.pf<a.pf?b:a);alive.delete(lo.mgr);out.push({week:w,mgr:lo.mgr,pf:lo.pf})}return{alive,out}}
function belt(T,weeks){let h=S.set.belt&&T.some(t=>t.mgr==S.set.belt)?S.set.belt:null;const rows=[];
 for(const w of weeks){const g=T.filter(t=>t.week==w);if(!h)h=g.reduce((a,b)=>b.pf>a.pf?b:a,g[0]).mgr;const t=g.find(x=>x.mgr==h);if(!t)continue;
  rows.push({week:w,holder:h,pf:t.pf,chal:t.om,pa:t.pa,res:t.res==1?'Held':t.res==0?'Lost':'Tie'});if(t.res==0||(t.res==.5&&S.set.tie=='lose'))h=t.om}
 return rows}

/* ============ 3. DERIVED DATA ============ */
const D={T:[],TP:[],weeks:[],pweeks:[],byW:{},mgrs:[],info:new Map(),pend:new Set(),slots:[],ps:15,np:6,reg:14,col:()=>PAL[0]};
let NM=null;const nmap=(TM,n)=>{if(!NM){NM=new Map();S.pts.forEach(r=>{const t=TM.get(r.league+'|'+r.year+'|'+r.team_id);if(t&&!NM.has(r.manager_name))NM.set(r.manager_name,t.manager)})}return NM.get(n)||n};
function finalByScores(w){const R=S.scr.filter(r=>r.YR==S.yr&&r.league==S.lg&&r.WK==w);if(!R.length)return false;let m=0;R.forEach(r=>{if(r.RUN>m)m=r.RUN});const ok=v=>v==0||v==50||v==100;return R.filter(r=>r.RUN==m).every(r=>ok(r.TMAWP)&&ok(r.TMBWP))}
function build(){NM=null;const TM=new Map(S.teams.map(t=>[t.league+'|'+t.year+'|'+t.team_id,t])),W=new Map(),rows=S.pts.filter(r=>r.year==S.yr&&r.league==S.lg),
 sr=S.teams.find(t=>t.league==S.lg&&t.year==S.yr);D.ps=sr?.playoff_start_week||15;D.np=sr?.num_playoff_teams||6;D.reg=D.ps-1;D.cfg=slotCfg(rows);D.slots=slotNames(D.cfg);D.info=new Map();
 S.teams.filter(t=>(!S.lg||t.league==S.lg)&&(!S.yr||t.year==S.yr)).forEach(t=>{D.info.set(+t.team_id,{team:t.team_name,mgr:t.manager})});
 rows.forEach(r=>{const k=r.week+'|'+r.team_id;let t=W.get(k);if(!t){const tm=TM.get(r.league+'|'+r.year+'|'+r.team_id);
  W.set(k,t={year:r.year,week:r.week,id:r.team_id,mgr:tm?.manager||nmap(TM,r.manager_name),team:tm?.team_name||r.team_name,opp:r.opponent_team_id,pf:0,pa:r.opponent_points,pl:[]});if(!D.info.has(+r.team_id))D.info.set(+r.team_id,{team:t.team,mgr:t.mgr})}t.pl.push(r)});
 const all=[...W.values()];all.forEach(t=>{t.pf=sum(t.pl.filter(isStart).map(r=>r.points));if(!isFinite(t.pf))t.pf=0;const o=W.get(t.week+'|'+t.opp);t.om=o?o.mgr:'?'});
 D.pend=new Set();if(S.cw&&S.cw.year==S.yr)[...new Set(all.map(t=>t.week))].forEach(w=>{if(w>=S.cw.week&&w<=D.reg&&!finalByScores(w))D.pend.add(w)});
 const inR=t=>t.week>=S.w[0]&&t.week<=S.w[1]&&(S.ip||!D.pend.has(t.week));
 const T=all.filter(t=>inR(t)&&t.week<=D.reg),TP=S.po?all.filter(inR):T;const byW={};T.forEach(t=>(byW[t.week]??=[]).push(t));
 for(const w in byW){const g=byW[w],n=g.length;g.forEach(t=>{t.etew=n>1?(g.filter(o=>o!==t&&o.pf<t.pf).length+.5*g.filter(o=>o!==t&&o.pf==t.pf).length)/(n-1):0;t.res=t.pf>t.pa?1:t.pf<t.pa?0:.5;t.rank=1+g.filter(o=>o.pf>t.pf).length})}
 TP.forEach(t=>t.slots=slots(t.pl,D.cfg));
 D.T=T;D.TP=TP;D.weeks=Object.keys(byW).map(Number).sort((a,b)=>a-b);D.pweeks=[...new Set(TP.map(t=>t.week))].sort((a,b)=>a-b);D.byW=byW;D.mgrs=[...new Set(all.map(t=>t.mgr))].filter(Boolean).sort();
 D.col=m=>PAL[Math.max(0,D.mgrs.indexOf(m))%PAL.length]}
const tname=id=>{const t=D.info.get(+id);return t?`${t.team} (${t.mgr})`:'Team '+id};

/* ============ 4. UI HELPERS ============ */
const SORT={};let CH=[];
function tbl(id,cols,rows,cls){const s=SORT[id];if(s){const c=cols[s.i];rows=[...rows].sort((a,b)=>{const x=c.v(a),y=c.v(b);return(x>y?1:x<y?-1:0)*s.d})}
 return`<div class=sc><table><thead><tr>${cols.map((c,i)=>`<th data-s="${id}|${i}">${c.h}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr data-m="${esc(r.mgr||'')}" class="${(cls?cls(r,i):'')+(S.hl&&S.hl==r.mgr?' hl':'')}">${cols.map(c=>`<td>${c.f?c.f(r):esc(c.v(r))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
document.addEventListener('click',e=>{const h=e.target.closest('th[data-s]');if(h){const[id,i]=h.dataset.s.split('|');const s=SORT[id];SORT[id]={i:+i,d:s&&s.i==+i?-s.d:-1};render();return}
 const r=e.target.closest('tr[data-m]');if(r&&r.dataset.m){S.hl=S.hl==r.dataset.m?null:r.dataset.m;render()}});
addEventListener('keydown',e=>{if(e.key=='Escape'&&S.hl){S.hl=null;render()}});
function ch(id,opt){
  const el=document.getElementById(id);if(!el)return;
  requestAnimationFrame(()=>{
    let c=echarts.getInstanceByDom(el);
    if(!c){c=echarts.init(el,S.dark?'dark':null);CH.push(c);c.on('click',p=>{const m=D.mgrs.includes(p.seriesName)?p.seriesName:D.mgrs.includes(p.name)?p.name:null;if(m){S.hl=S.hl==m?null:m;render()}})}
    c.setOption({animation:false,backgroundColor:'transparent',tooltip:{trigger:'axis',confine:true},legend:{type:'scroll',top:0},grid:{left:52,right:52,top:40,bottom:60},toolbox:{feature:{saveAsImage:{title:'PNG'},dataZoom:{},dataView:{title:'Data',readOnly:true}}},...opt},true);
    setTimeout(()=>c.resize(),50);
  });
}
addEventListener('resize',()=>CH.forEach(c=>c.resize()));
const spark=a=>{if(a.length<2)return'';const mn=Math.min(...a),mx=Math.max(...a),p=a.map((v,i)=>`${i*60/(a.length-1)},${18-(v-mn)/(mx-mn||1)*16}`).join(' ');return`<svg width=62 height=20><polyline points="${p}" fill=none stroke="currentColor" stroke-width=1.5 /></svg>`};
const f1=x=>(+x).toFixed(1),f2=x=>(+x).toFixed(2),sg=x=>(x>0?'+':'')+f2(x);
const lineS=(m,data,extra)=>({name:m,type:'line',data,color:D.col(m),symbolSize:5,emphasis:{focus:'series'},lineStyle:{width:S.hl==m?4:2,opacity:!S.hl||S.hl==m?1:.2},...extra});
const empty=t=>`<div class=empty>${t||'No data yet. Drop <b>W##Points.csv</b>, <b>W##Scores.csv</b>, <b>W##Teams.csv</b>, <b>W##Transactions.csv</b> (or a .sqlite file) anywhere on this page, or set a live URL under Settings.'}</div>`;

/* ============ 5. VIEWS ============ */
const V={};
V.standings=()=>{const A=agg(D.T),lw=D.weeks[D.weeks.length-1],P=Object.fromEntries(agg(D.T.filter(t=>t.week<lw)).map(o=>[o.mgr,o.rank])),np=D.np;
 const fb=o=>S.teams.find(t=>t.team_id==o.id&&t.year==S.yr&&t.league==S.lg)?.faab_balance??'';
 return`<h3>Standings <small>ETEW% = avg share of league outscored each week · WABL = wins − (ETEW% × games) · RABL = ETEW rank − actual rank · AVG* = trimmed avg (excl. best & worst week) · dashed line = playoff cut (${np})</small></h3>`+
 tbl('st',[{h:'#',v:o=>o.rank},
 {h:'Team',v:o=>o.mgr,f:o=>`<span class=dot style="background:${D.col(o.mgr)}"></span>${esc(o.team)} <small>${esc(o.mgr)}</small>`},{h:'W-L',v:o=>o.W+o.T/2,f:o=>`${o.W}-${o.L}${o.T?'-'+o.T:''}`},
 {h:'PF',v:o=>o.PF,f:o=>f1(o.PF)},{h:'PA',v:o=>o.PA,f:o=>f1(o.PA)},{h:'ETEW%',v:o=>o.et,f:o=>(o.et*100).toFixed(1)+'%'},{h:'WABL',v:o=>o.wabl,f:o=>`<span style="color:${o.wabl>=0?'#009E73':'#D55E00'}">${sg(o.wabl)}</span>`},{h:'RABL',v:o=>o.rE-o.rank,f:o=>(o.rE-o.rank>0?'+':'')+(o.rE-o.rank)},
 {h:'Best',v:o=>o.best,f:o=>`${f2(o.best)} (${o.bw})`},{h:'Worst',v:o=>o.worst,f:o=>`${f2(o.worst)} (${o.ww})`},{h:'AVG',v:o=>o.avg,f:o=>f2(o.avg)},{h:'AVG*',v:o=>o.avgT,f:o=>f2(o.avgT)},{h:'SDEV',v:o=>o.sd,f:o=>f2(o.sd)},{h:'FAAB',v:fb,f:o=>fb(o)===''?'':'$'+fb(o)},{h:'Trend',v:o=>o.avg,f:o=>spark(o.pfs)}],A,(o,i)=>i==np-1?'po':'')};

V.matchups=()=>{const w=S.mw&&D.byW[S.mw]?+S.mw:D.weeks[D.weeks.length-1],g=D.byW[w]||[],seen=new Set(),pairs=[];
 g.forEach(t=>{const o=g.find(x=>x.id==t.opp);if(!o||seen.has(t.id)||seen.has(o.id))return;seen.add(t.id);seen.add(o.id);pairs.push([t,o])});
 const side=t=>{const st=t.pl.filter(isStart).sort((a,b)=>b.points-a.points),bn=t.pl.filter(r=>!isStart(r)&&r.selected_position=='BN').sort((a,b)=>b.points-a.points);

/* ============ 6. LIVE WIN PROBABILITY ============ */
const tparse = t => {
  if (!t) return new Date(NaN);
  const s = String(t).trim();
  const m = s.match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2}):(\d{2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]);
  const dt = new Date(s);
  return isNaN(dt) ? new Date(NaN) : dt;
};

const tlab = d => {
  if (isNaN(d)) return '';
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const dy = days[d.getDay()];
  const hh = (d.getHours() % 12) || 12;
  const mm = String(d.getMinutes()).padStart(2, '0');
  const dateStr = (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear();
  return `${mm}
${hh}:
${dy}
${dateStr}`;
};

function liveCtx() {
  const sc = S.scr.filter(r => (!S.yr || r.YR == S.yr) && (!S.lg || r.league == S.lg));
  const ws = [...new Set(sc.map(r => r.WK))].sort((a,b)=>a-b);
  if (!ws.length) return { ws, seasons: [...new Set(S.scr.map(r => r.league+' '+r.YR))].sort() };
  const cwk = S.cw && S.cw.year == S.yr && ws.includes(S.cw.week) ? S.cw.week : ws[ws.length-1];
  const w = ws.includes(+S.lvw) ? +S.lvw : cwk, rows = sc.filter(r => r.WK == w), seen = new Set(), mu = [];
  rows.forEach(r => { const k = r.TMA+'|'+r.TMB; if (seen.has(r.TMB+'|'+r.TMA) || seen.has(k)) return; seen.add(k); mu.push(k) });
  mu.sort((x,y)=>tname(x.split('|')[0]).localeCompare(tname(y.split('|')[0])));
  const m = mu.includes(S.lm) ? S.lm : mu[0];
  const [a, b] = m ? m.split('|').map(Number) : [0, 0];
  
  const R = rows.filter(r => (r.TMA == a && r.TMB == b) || (r.TMA == b && r.TMA != r.TMB && r.TMB == a))
    .map(r => { 
      const f = r.TMA == a; 
      return { 
        d: tparse(r.TIME), 
        run: +r.RUN || 0, 
        aw: f ? (+r.TMAWP || 0) : (+r.TMBWP || 0), 
        ap: f ? (+r.TMAPTS || 0) : (+r.TMBPTS || 0), 
        aj: f ? (+r.TMAPROJ || 0) : (+r.TMBPROJ || 0), 
        bw: f ? (+r.TMBWP || 0) : (+r.TMAWP || 0), 
        bp: f ? (+r.TMBPTS || 0) : (+r.TMAPTS || 0), 
        bj: f ? (+r.TMBPROJ || 0) : (+r.TMAPROJ || 0) 
      }; 
    })
    .filter(r => !isNaN(r.d))
    .sort((x, y) => (x.d - y.d) || (x.run - y.run));

  return { ws, w, mu, m, a, b, R };
}

V.live.post = () => {
  const c = liveCtx();
  if (!c.ws.length || !c.R || !c.R.length) {
    const e = $('#c1'); if (e) e.outerHTML = empty('No snapshots for this matchup.');
    return;
  }
  const A = D.info.get(c.a) || { team: 'Team ' + c.a, mgr: '' };
  const B = D.info.get(c.b) || { team: 'Team ' + c.b, mgr: '' };
  const cA = A.mgr ? D.col(A.mgr) : PAL[0];
  const cB = B.mgr ? D.col(B.mgr) : PAL[3];
  const n = c.R.length;
  const sl = $('#sl');
  if (sl) { sl.max = n; sl.value = S.cur && S.cur <= n ? S.cur : n; }
  
  const curIdx = S.cur && S.cur <= n ? S.cur : n;
  const fullL = c.R.map(r => tlab(r.d));
  const last = c.R[curIdx - 1];
  const mx = Math.max(10, ...c.R.flatMap(r => [r.ap, r.bp, r.aj, r.bj]));
  const rm = Math.ceil(mx / 10) * 10;
  
  const lhEl = $('#lh');
  if (lhEl) lhEl.innerHTML = `<span style="color:${cA}">${esc(A.team)} (${esc(A.mgr || 'A')})</span> <span style="opacity:.6">vs.</span> <span style="color:${cB}">${esc(B.team)} (${esc(B.mgr || 'B')})</span>`;
  const lsubEl = $('#lsub');
  if (lsubEl) lsubEl.textContent = `${esc(S.lg || 'NDL')} ${esc(S.yr || '')} Week ${c.w}`;

  const ltEl = $('#lt');
  if (ltEl) ltEl.textContent = `${fullL[curIdx - 1]?.replace(/\n/g, ' ') || ''} · ${f2(last.ap)}–${f2(last.bp)} · win ${last.aw}%/${last.bw}% · ${curIdx}/${n} snapshots` + (S.cur ? '' : ' (latest)');

  const apData = c.R.map((r, i) => i < curIdx ? r.ap : null);
  const bpData = c.R.map((r, i) => i < curIdx ? r.bp : null);
  const ajData = c.R.map((r, i) => i < curIdx ? r.aj : null);
  const bjData = c.R.map((r, i) => i < curIdx ? r.bj : null);
  const awData = c.R.map((r, i) => i < curIdx ? r.aw : null);
  const bwData = c.R.map((r, i) => i < curIdx ? r.bw : null);

  ch('c1', {
    tooltip: {
      trigger: 'axis',
      confine: true,
      formatter: ps => {
        const idx = ps[0].dataIndex;
        const r = c.R[idx];
        if (!r || idx >= curIdx) return '';
        const dtStr = fullL[idx].replace(/\n/g, ' ');
        return `<b>${dtStr}</b><br>` +
               `<span class=dot style="background:${cA}"></span>${esc(A.team)}: <b>${r.aw}%</b> · ${f2(r.ap)} pts · proj ${f2(r.aj)}<br>` +
               `<span class=dot style="background:${cB}"></span>${esc(B.team)}: <b>${r.bw}%</b> · ${f2(r.bp)} pts · proj ${f2(r.bj)}`;
      }
    },
    animation: false,
    legend: { type: 'scroll', top: 0 },
    grid: { left: 52, right: 52, top: 44, bottom: 70 },
    xAxis: {
      type: 'category',
      data: fullL,
      boundaryGap: false,
      axisLabel: { 
        hideOverlap: true, 
        interval: Math.max(0, Math.floor(fullL.length / 10) - 1), 
        rotate: 0,
        fontSize: 10,
        lineHeight: 12
      }
    },
    yAxis: [
      { type: 'value', min: 0, max: 100, interval: 10, name: 'Win Probability', axisLabel: { formatter: '{value}%' } },
      { type: 'value', min: 0, max: rm, interval: Math.max(10, Math.round(rm / 10)), name: 'Points', splitLine: { show: false } }
    ],
    series: [
      { name: A.team + ' win %', type: 'line', stack: 'wp', symbol: 'none', data: awData, color: cA, lineStyle: { width: 0 }, areaStyle: { opacity: .45, color: cA } },
      { name: B.team + ' win %', type: 'line', stack: 'wp', symbol: 'none', data: bwData, color: cB, lineStyle: { width: 0 }, areaStyle: { opacity: .45, color: cB }, markLine: { symbol: 'none', silent: true, label: { show: false }, lineStyle: { type: 'dashed', color: '#666', width: 1.5 }, data: [{ yAxis: 50 }] } },
      { name: A.team + ' pts', type: 'line', yAxisIndex: 1, symbol: 'none', data: apData, color: cA, lineStyle: { width: 3 }, step: 'end' },
      { name: B.team + ' pts', type: 'line', yAxisIndex: 1, symbol: 'none', data: bpData, color: cB, lineStyle: { width: 3 }, step: 'end' },
      { name: A.team + ' proj', type: 'line', yAxisIndex: 1, symbol: 'none', data: ajData, color: cA, lineStyle: { type: 'dotted', width: 2 } },
      { name: B.team + ' proj', type: 'line', yAxisIndex: 1, symbol: 'none', data: bjData, color: cB, lineStyle: { type: 'dotted', width: 2 } }
    ]
  });

let pt;
function play() {
  clearInterval(pt);
  const sl = $('#sl'); if (!sl) return;
  const mx = +sl.max;
  S.cur = 1;
  pt = setInterval(() => {
    S.cur++;
    if (S.cur > mx) {
      S.cur = 0;
      clearInterval(pt);
    }
    V.live.post();
  }, 40);
}

 <p><label>Live SQLite file URL (polled every 60s) <input id=sq style="width:100%" value="${esc(S.set.sqlUrl)}"></label></p>
 <button class=btn onclick="saveSet()">Save &amp; poll now</button> <button class=btn onclick="resetAll()" style="color:#D55E00">Reset data</button></div>
 <div class=card><small>Rows: points ${S.pts.length} · scores ${S.scr.length} · teams ${S.teams.length} · transactions ${S.tx.length}</small></div>`;
function saveSet(){S.set={belt:$('#sb').value.trim(),tie:$('#stie').value,csvUrls:$('#su').value.trim(),sqlUrl:$('#sq').value.trim()};put('set',S.set);poll()}
async function resetAll(){if(!confirm('Delete all stored data?'))return;S.pts=[];S.scr=[];S.teams=[];S.tx=[];S.cw=null;await save();refresh()}

/* ============ 7. SHELL, ROUTING, THEME ============ */
const TABS=[['standings','Standings'],['matchups','Matchups'],['leaders','Weekly Leaders'],['wae','Wins Above Even'],['rank','Rank'],['pos','Points by Position'],['survivor','Survivor'],['belt','Belt'],['live','Live Win Prob'],['settings','Settings']];
function render(){CH.forEach(c=>c.dispose());CH=[];clearInterval(pt);document.documentElement.dataset.t=S.dark?'dark':'light';
 $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k==S.tab?'on':''}" onclick="S.tab='${k}';render()">${l}</button>`).join('')+(S.hl?` <span class=btn onclick="S.hl=null;render()">✕ ${esc(S.hl)}</span>`:'');
 location.hash=`t=${S.tab}&y=${S.lg}-${S.yr}&w=${S.w[0]}-${S.w[1]}`;
 const noData=!S.pts.length&&!S.scr.length&&S.tab!='settings'&&S.tab!='live';
 const ban=D.pend.size&&!['settings','live'].includes(S.tab)?`<div class=card>⏱ Week ${[...D.pend].join(', ')} is still in progress, so it is left out of the results below (tick “In-progress wk” to include it). See the <a href="#" onclick="S.tab='live';render();return false">Live Win Prob</a> tab.</div>`:'';
 const has=S.tab=='pos'?D.TP.length:D.T.length;
 $('#main').innerHTML=noData?empty():ban+(has||S.tab=='settings'||S.tab=='live'||S.scr.length?V[S.tab]():empty('No completed regular-season rows match the current filters.'));
 if(!noData&&V[S.tab].post)try{V[S.tab].post()}catch(e){console.warn(e)}}
function refresh(){
 const ss=[...new Map([...S.pts.map(r=>[r.league+'|'+r.year,{lg:r.league,yr:r.year}]), ...S.scr.map(r=>[r.league+'|'+r.YR,{lg:r.league,yr:r.YR}]), ...S.teams.map(r=>[r.league+'|'+r.year,{lg:r.league,yr:r.year}])].filter(x=>x[1].yr)).values()].sort((a,b)=>a.yr-b.yr||(a.lg<b.lg?-1:1));
 if(!ss.some(x=>x.yr==S.yr&&x.lg==S.lg)){const l=ss[ss.length-1];S.yr=l?l.yr:'';S.lg=l?l.lg:''}
 $('#fy').innerHTML=ss.map(x=>`<option value="${x.lg}|${x.yr}" ${x.yr==S.yr&&x.lg==S.lg?'selected':''}>${x.lg} ${x.yr}</option>`).join('');build();render()}
$('#fy').onchange=e=>{const[l,y]=e.target.value.split('|');S.lg=l;S.yr=+y;S.lm='';S.lvw='';S.mw='';refresh()};
$('#po').onchange=e=>{S.po=e.target.checked;build();render()};$('#ip').onchange=e=>{S.ip=e.target.checked;build();render()};
let db;[$('#w1'),$('#w2')].forEach(i=>i.oninput=()=>{clearTimeout(db);db=setTimeout(()=>{S.w=[+$('#w1').value||1,+$('#w2').value||99];build();render()},250)});
$('#th').onclick=()=>{S.dark=!S.dark;render()};
(async()=>{for(const k of['pts','scr','teams','tx'])S[k]=(await get(k))||[];S.set={...S.set,...(await get('set')||{})};S.cw=(await get('cw'))||null;
 const h=new URLSearchParams(location.hash.slice(1));if(h.get('t')&&V[h.get('t')])S.tab=h.get('t');
 const y=(h.get('y')||'').split('-');if(y.length==2&&y[0]&&+y[1]){S.lg=y[0];S.yr=+y[1]}
 const w=(h.get('w')||'').split('-');if(w.length==2){S.w=[+w[0]||1,+w[1]||99];$('#w1').value=S.w[0];$('#w2').value=S.w[1]}
 refresh();
 if(S.set.csvUrls||S.set.sqlUrl){await poll()}
})();
</script></body></html>
